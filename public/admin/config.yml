backend:
  name: github
  repo: zhangshenghao22-max/shenghao-s-blog
  branch: main
  base_url: https://decap-oauth.zhangshenghao22.workers.dev
  auth_endpoint: auth
  auth_scope: public_repo

site_url: https://www.zhangshenghao.com
display_url: https://www.zhangshenghao.com
logo_url: /favicon.svg
locale: zh_Hans

media_folder: public/images
public_folder: /images

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    editor:
      preview: false
    summary: "{{title}}"
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 摘要
        name: description
        widget: text
      - label: 发布日期
        name: pubDate
        widget: date
        format: YYYY-MM-DD
      - label: 更新日期
        name: updatedDate
        widget: date
        format: YYYY-MM-DD
        required: false
      - label: 分类
        name: category
        widget: select
        default: life
        options:
          - label: 生活
            value: life
          - label: 技术
            value: tech
      - label: 标签
        name: tags
        widget: list
        default: []
        required: false
        allow_add: true
        field:
          label: 标签
          name: tag
          widget: string
      - label: 封面图路径
        name: cover
        widget: string
        required: false
        hint: "填写 /images/xxx.svg 或 /images/uploads/xxx.png；上传图片后会保存在 public/images。"
      - label: 封面说明
        name: coverAlt
        widget: string
        required: false
      - label: 草稿
        name: draft
        widget: boolean
        default: false
        required: false
      - label: 正文
        name: body
        widget: markdown
