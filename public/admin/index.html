<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>清夏玖的博客 · 文章发布后台</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --cream: #fffaf1;
        --ink: #222029;
        --muted: #7d7785;
        --line: rgba(255, 255, 255, 0.68);
        --blue: #9fd8ff;
        --pink: #ffd8e7;
        --gold: #f7d88a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(255, 216, 231, 0.72), transparent 34rem),
          radial-gradient(circle at right 8rem, rgba(159, 216, 255, 0.72), transparent 34rem),
          linear-gradient(135deg, #fffaf1 0%, #f8fbff 50%, #fff3e5 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 18px;
        z-index: 0;
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.74);
        border-radius: 32px;
        box-shadow: 0 24px 80px rgba(72, 54, 36, 0.08);
      }

      #nc-root {
        position: relative;
        z-index: 2;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          load_config_file: true,
          editor: { preview: false },
        },
      });
    </script>
  </body>
</html>
