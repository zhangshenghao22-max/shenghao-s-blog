<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#071c2c" />
    <title>清夏玖 · 海边邮局</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #071c2c url("/images/summer/hero.jpg") center / cover no-repeat fixed;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 16px;
        z-index: 0;
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, .28);
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(3, 15, 27, .55), rgba(3, 15, 27, .72));
      }
      #nc-root { position: relative; z-index: 1; min-height: 100vh; padding: 32px; }
    </style>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          load_config_file: true,
          editor: { preview: false },
        },
      });
    </script>
  </body>
</html>
