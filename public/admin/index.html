<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050708" />
    <title>清夏玖 · 归档终端</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #050708;
        background-image:
          radial-gradient(70rem 40rem at 80% 0%, rgba(69, 223, 238, 0.08), transparent 60%),
          radial-gradient(50rem 30rem at 10% 100%, rgba(242, 181, 68, 0.06), transparent 60%),
          linear-gradient(180deg, #050708, #080c0d);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 16px;
        z-index: 0;
        pointer-events: none;
        border: 1px solid rgba(226, 240, 238, 0.12);
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(226, 240, 238, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(226, 240, 238, 0.03) 1px, transparent 1px);
        background-size: 96px 96px;
      }
      #nc-root { position: relative; z-index: 1; min-height: 100vh; }
    </style>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          load_config_file: true,
          editor: { preview: false },
        },
      });
    </script>
  </body>
</html>
