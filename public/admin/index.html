<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#8ee4ff" />
    <title>清夏玖 · 海边邮局</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #8fe3ff;
        background-image:
          radial-gradient(circle at 82% 8%, rgba(255, 209, 102, .55), transparent 22rem),
          linear-gradient(180deg, #8fe3ff 0%, #d8f6ff 52%, #ffefd0 100%);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 18px;
        z-index: 0;
        pointer-events: none;
        border: 3px solid #18313c;
        background: rgba(255, 250, 240, .42);
        box-shadow: 10px 12px 0 rgba(24, 49, 60, .12);
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(24, 49, 60, .18) .7px, transparent .8px);
        background-size: 5px 5px;
        opacity: .18;
      }
      #nc-root { position: relative; z-index: 1; min-height: 100vh; padding: 34px; }
    </style>
  </head>
  <body>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.12.2/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          load_config_file: true,
          editor: { preview: false },
        },
      });
    </script>
  </body>
</html>
